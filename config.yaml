# Single source of truth for every tunable in the project.

paths:
  raw: data/raw
  outputs: outputs

delphi:
  # 8 full flu seasons: 2018-19 through 2025-26 (season = MMWR week 40 -> week 39).
  start_epiweek: 201840
  end_epiweek: 202639
  # Seasons with atypical (COVID-era) ILI dynamics; kept in the data but flagged.
  covid_seasons: ["2020-21", "2021-22"]
  # A location must cover at least this share of weeks to be analysed. 0.85 ~= 7 of 8 seasons:
  # keeps AK/CT/HI/OK/OR/SD/UT (missing only 2025-26) but drops FL (no data before 2021-22).
  min_coverage: 0.85
  # Territories / sub-state jurisdictions outside the 50 states + DC comparison.
  excluded_locations: [pr, vi, jfk]
  # NY combined stops in 2025; NY excluding NYC is complete, so it stands in for NY.
  ny_location: ny_minus_jfk

correlation:
  max_lag: 4            # weeks, tested from -max_lag to +max_lag
  min_peak_r: 0.3       # peak cross-correlation needed to call a lead/lag pair
  min_gain_over_lag0: 0.05  # ...and peak r must beat lag-0 r by this much (~1 s.e. of r at n~400)
  # ILINet holiday effect: routine visits drop, ILI% jumps everywhere in the same week.
  holiday_mmwr_weeks: [51, 52, 53, 1, 2]
  peak_smoothing_weeks: 3  # rolling mean used before locating each season's peak
  top_n_pairs: 10       # pairs listed in each report

forecast:
  target: nat
  horizons: [1, 2, 3, 4]
  # First forecast origin (start of 2023-24 season). Every later week is an origin;
  # each origin refits on data up to and including that week only (expanding window).
  backtest_start: "2023-10-01"
  exclude_covid_from_training: true
  # "Correlated states" (no state leads national; see Module 2): top-n by lag-0 correlation
  # of weekly changes with national, selected ONLY on data before backtest_start.
  n_correlated_states: 5
  arima:
    order: [2, 1, 1]      # fit on log(ILI)
    window_weeks: 156     # trailing window refit at every origin
  # Model selection uses only forecasts whose target week is before this date (2023-24 and
  # 2024-25 seasons); forecasts from origins on/after it (2025-26) are an untouched holdout.
  selection_end: "2025-09-28"
  # Chosen from the backtest: XGBoost (national features only) had the lowest MAE/RMSE at h=2-4
  # and was within 0.005 MAE of LightGBM at h=1; correlated-state features did not improve it.
  production_model: xgboost    # model saved by `train` and used by `predict`
  production_use_states: false
  lightgbm:
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 15
    min_child_samples: 10
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    random_state: 42
    verbose: -1
    n_jobs: 1             # single thread is ~15x faster on ~250-row training sets
  xgboost:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 3
    min_child_weight: 3
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    n_jobs: 1
