[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "health-signals-lab"
version = "0.1.0"
description = "LLM literature extraction, ILI lead/lag reports, and ILI forecasting."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "lightgbm>=4.3",
    "xgboost>=2.0",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "anthropic>=0.40",
    "pydantic>=2.6",
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "requests>=2.31",
    "pyyaml>=6.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lab = ["reports/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
